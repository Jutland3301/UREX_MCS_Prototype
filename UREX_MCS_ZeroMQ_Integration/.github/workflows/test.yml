name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile .proto
        run: python scripts/generate_protobuf.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
